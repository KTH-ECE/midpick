<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDPICK - Find Midpoint Between You and Your Friend.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="lang-toggle">
      <button type="button" class="lang-opt" data-lang="en">EN</button>
      <button type="button" class="lang-opt" data-lang="ko">한</button>
    </div>
    <h1>MidPick</h1>
    <p class="subtitle" data-i18n="subtitle">Find the midpoint between you and your friends.</p>
  </header>

  <div class="page-body">
    <main>
      <section class="search-card">
        <div id="location-inputs"></div>
        <button id="search-btn">Find midpoint</button>
      </section>

      <p id="error-msg" class="error-msg hidden"></p>

      <div id="map"></div>

      <div id="midpoint-box" class="midpoint-box hidden">
        <span class="midpoint-icon" aria-hidden="true">📍</span>
        <span id="midpoint-value" class="midpoint-value"></span>
        <span class="midpoint-copy-hint" data-i18n="copyHint">Click to copy</span>
        <span id="copied-toast" class="copied-toast" data-i18n="copied">Copied!</span>
      </div>

      <section id="results-section" class="hidden">
        <h2 class="results-heading"><span data-i18n="nearby">Nearby</span> <span id="results-count"></span></h2>
        <ul id="place-list"></ul>
      </section>
    </main>

    <aside class="filter-panel">
      <p class="filter-title" data-i18n="locations">Locations</p>
      <div class="slider-row">
        <input type="range" id="loc-count" min="2" max="7" value="2">
        <span class="slider-val" id="loc-count-val">2</span>
      </div>

      <hr class="filter-divider">

      <p class="filter-title" data-i18n="radius">Search radius</p>
      <div class="slider-row">
        <input type="range" id="radius-km" min="1" max="5" value="2">
        <span class="slider-val" id="radius-km-val">2km</span>
      </div>

      <hr class="filter-divider">

      <p class="filter-title" data-i18n="filter">Filter</p>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="CE7" checked>
        <span class="filter-dot" style="background:#43AA8B"></span>
        <span data-i18n="filt_CE7">Cafe</span>
      </label>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="FD6" checked>
        <span class="filter-dot" style="background:#F4A261"></span>
        <span data-i18n="filt_FD6">Restaurant</span>
      </label>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="SW8" checked>
        <span class="filter-dot" style="background:#9B5DE5"></span>
        <span data-i18n="filt_SW8">Station</span>
      </label>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="CS2">
        <span class="filter-dot" style="background:#2196F3"></span>
        <span data-i18n="filt_CS2">Convenience Store</span>
      </label>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="AC5">
        <span class="filter-dot" style="background:#795548"></span>
        <span data-i18n="filt_AC5">Study Cafe</span>
      </label>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="OL7">
        <span class="filter-dot" style="background:#FF5722"></span>
        <span data-i18n="filt_OL7">Gas / EV Station</span>
      </label>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="CT1">
        <span class="filter-dot" style="background:#E91E63"></span>
        <span data-i18n="filt_CT1">Cinema &amp; Entertainment</span>
      </label>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="AD5">
        <span class="filter-dot" style="background:#607D8B"></span>
        <span data-i18n="filt_AD5">Accommodation</span>
      </label>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="HP8">
        <span class="filter-dot" style="background:#F44336"></span>
        <span data-i18n="filt_HP8">Hospital</span>
      </label>
      <label class="filter-item">
        <input class="filter-check" type="checkbox" value="MT1">
        <span class="filter-dot" style="background:#009688"></span>
        <span data-i18n="filt_MT1">Shopping</span>
      </label>

      <hr class="filter-divider">

      <p class="filter-title" data-i18n="byName">Search by name</p>
      <input type="text" id="custom-keyword" class="custom-input"
             data-i18n-ph="customPlaceholder" placeholder="e.g. Starbucks" autocomplete="off">
    </aside>
  </div>

  <!--
    config.js is gitignored.
  -->
  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
